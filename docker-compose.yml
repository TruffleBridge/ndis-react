# NDIS admin UI (static SPA) — served by nginx on host port 8080.
# Deployed by ndis-devops/deploy/ndis-react.sh:  docker compose up -d --build
services:
  admin:
    build:
      context: .
      args:
        # Vite build mode -> selects .env.<mode>. Override per box, e.g. BUILD_MODE=development.
        BUILD_MODE: ${BUILD_MODE:-production}
    image: ndis-react-admin:latest
    restart: unless-stopped
    ports:
      - "8080:80"
